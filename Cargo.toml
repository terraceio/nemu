[package]
name = "nemu"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Nix-defined development guests managed with QEMU"

[lints]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
nix = { version = "0.31", default-features = false, features = ["signal", "process", "user"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "process", "net", "io-util", "time"] }
uuid = { version = "1", features = ["v4", "serde"] }
